<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家谱树（可编辑）</title>
<style>
  :root{
    --line:#b08968;
    --card-bg:#fffdf7;
    --card-border:#c9a36b;
    --name:#3a2e1f;
    --sub:#7a6a52;
    --accent:#8c5a2b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Songti SC","SimSun","STSong","Noto Serif CJK SC",serif;
    color:var(--name); background:#f3ede1;
  }

  header{ text-align:center; padding:20px 12px 6px; }
  header h1{ margin:0; font-size:28px; letter-spacing:6px; color:var(--accent); display:inline-block; }
  header .sub{ color:var(--sub); margin-top:6px; font-size:14px; letter-spacing:2px; display:inline-block; }
  body.edit [contenteditable]{ outline:1px dashed #c9a36b; border-radius:6px; padding:2px 8px; cursor:text; }
  body.edit [contenteditable]:focus{ outline:2px solid var(--accent); }

  .layout{ display:flex; align-items:flex-start; }
  .main{ flex:1; min-width:0; }
  .toolbar .sep{ width:1px; height:22px; background:#d9cbb2; margin:0 2px; }
  .toolbar{
    position:sticky; top:0; z-index:20;
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center;
    padding:10px; background:#f3ede1; border-bottom:1px solid #e0d4bd;
  }
  .toolbar button, .toolbar label.btn{
    font-family:inherit; font-size:14px; cursor:pointer;
    padding:6px 14px; border:1px solid var(--card-border);
    background:var(--card-bg); color:var(--accent); border-radius:6px; user-select:none;
  }
  .toolbar button:hover, .toolbar label.btn:hover{ background:#efe4cf; }
  .toolbar .spacer{ flex:1; }
  #saveState{ font-size:13px; color:#5a8a3a; }
  #saveState.warn{ color:#b0413e; }

  .scroll{ overflow:auto; padding:20px 30px 80px; }

  /* ===== 树状图核心样式 ===== */
  .tree{ display:flex; justify-content:center; min-width:max-content; }
  .tree ul{ position:relative; padding-top:22px; display:flex; justify-content:center; margin:0; list-style:none; }
  .tree li{ position:relative; padding:22px 4px 0 4px; list-style:none; text-align:center; }
  .tree li::before, .tree li::after{
    content:''; position:absolute; top:0; right:50%;
    border-top:2px solid var(--line); width:50%; height:22px;
  }
  .tree li::after{ right:auto; left:50%; border-left:2px solid var(--line); }
  .tree li:only-child::before, .tree li:only-child::after{ display:none; }
  .tree li:only-child{ padding-top:0; }
  .tree li:first-child::before, .tree li:last-child::after{ border:0 none; }
  .tree li:last-child::before{ border-right:2px solid var(--line); border-radius:0 6px 0 0; }
  .tree li:first-child::after{ border-radius:6px 0 0 0; }
  .tree ul::before{ content:''; position:absolute; top:0; left:50%; border-left:2px solid var(--line); width:0; height:22px; }

  .node{ display:inline-block; position:relative; vertical-align:top; text-align:center; }
  .family{
    display:inline-block; text-align:center;
    border:1.5px solid var(--card-border); border-radius:12px;
    background:#fffaf0; padding:4px; box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .pair{ display:flex; }
  .person{
    min-width:120px; max-width:190px;
    padding:10px 12px;
    text-align:center; line-height:1.5;
  }
  .person + .person{ margin-left:-1.5px; border-left:1.5px dashed var(--card-border); }
  .nm{ font-size:18px; font-weight:bold; color:var(--name); }
  .zi{ font-size:12px; color:var(--sub); margin-top:2px; }
  .life{ font-size:12px; color:var(--sub); margin-top:3px; }
  .life2{ font-size:11px; color:var(--sub); margin-top:4px; text-align:left; }
  .desc{
    margin-top:6px; padding:6px 8px; text-align:left;
    font-size:12px; color:#5a4a36; line-height:1.6;
    border-top:1px dashed #e0d4bd; max-height:120px; overflow:auto;
  }
  body.edit .desc{ background:#fff; border:1px dashed #c9a36b; border-radius:6px; min-height:36px; }

  /* 仿墓碑：男方已故，展示模式 */
  .tomb{
    display:inline-block; position:relative;
    background:linear-gradient(#f7f2e6,#efe7d6);
    border:2px solid #9c8a66; border-radius:16px 16px 8px 8px;
    padding:12px 12px 14px; box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .tomb .cap{
    text-align:center; font-size:13px; color:#8a7a5c; letter-spacing:3px;
    border-bottom:1px solid #d8c9a8; padding-bottom:6px; margin-bottom:8px;
  }
  .tomb .cols{ display:flex; }
  .tomb .col{ padding:4px 8px; text-align:center; min-width:40px; }
  .tomb .col + .col{ border-left:none; }
  .tomb .lab{ font-size:14px; color:#8a7a5c; font-weight:bold; margin-bottom:4px; }
  .tomb .nm{
    writing-mode: vertical-rl; text-orientation: upright;
    font-size:20px; font-weight:bold; color:var(--name);
    margin:0 auto; letter-spacing:3px; min-height:28px;
  }
  .tomb .rank{ font-size:13px; color:#9a8a6c; margin-top:4px; }
  .tomb .life{ font-size:12px; color:#7a6a52; margin-top:3px; }
  .tomb .life2{ font-size:11px; color:#7a6a52; margin-top:4px; text-align:left; }
  .tomb .desc{
    margin-top:6px; padding:6px 8px; text-align:left;
    font-size:12px; color:#5a4a36; line-height:1.6;
    border-top:1px dashed #d8c9a8; max-height:120px; overflow:auto;
  }
  body.edit .tomb .desc{ background:#fff; border:1px dashed #c9a36b; border-radius:6px; min-height:36px; }
  .tomb{ display:inline-flex; align-items:stretch; }
  .tomb-addr-side{
    writing-mode: vertical-rl; text-orientation: upright;
    border-left:1px solid #d8c9a8; margin-left:12px; padding-left:10px;
    display:flex; align-items:center; gap:6px;
    font-size:13px; color:#7a6a52; max-height:200px;
  }
  .tomb-addr-side .addr-lab{ color:#8a7a5c; font-weight:bold; }
  .tomb-addr-side .addr-v{ min-width:14px; }
  body.edit .tomb-addr-side .addr-v{ background:#fff; border:1px dashed #c9a36b; border-radius:6px; min-height:36px; padding:2px 4px; outline:none; }
  .gen-tag{
    position:absolute; left:2px; top:-10px;
    background:var(--accent); color:#fff; font-size:11px;
    padding:1px 6px; border-radius:10px; z-index:2;
  }
  .node .acts{ display:none; margin-top:8px; gap:6px; justify-content:center; }
  .node button{
    font-family:inherit; font-size:12px; cursor:pointer;
    padding:2px 8px; border:1px solid var(--card-border);
    background:#fff; color:var(--accent); border-radius:5px;
  }
  .node button:hover{ background:#efe4cf; }
  .node button.del:hover{ background:#f6d9d6; border-color:#b0413e; color:#b0413e; }

  .edit-panel{
    display:none; text-align:center; margin-top:30px; padding:14px;
    border-top:1px dashed var(--card-border); color:var(--sub); font-size:14px;
  }
  body.edit .edit-panel{ display:block; }
  body.edit .node .acts{ display:flex; }
  .edit-panel .stat{ margin-bottom:10px; }
  .edit-panel button{
    font-family:inherit; font-size:14px; cursor:pointer;
    padding:6px 16px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; border-radius:6px; margin:0 6px;
  }
  .edit-panel button.ghost{ background:var(--card-bg); color:var(--accent); }

  .overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.4);
    z-index:100; align-items:center; justify-content:center;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:#fffdf7; border:1.5px solid var(--card-border); border-radius:10px;
    padding:20px 24px; width:340px; box-shadow:0 8px 30px rgba(0,0,0,.25);
  }
  .modal h3{ margin:0 0 14px; color:var(--accent); font-size:18px; }
  .modal label{ display:block; font-size:13px; color:var(--sub); margin:10px 0 3px; }
  .modal input, .modal textarea{
    width:100%; padding:7px 9px; font-family:inherit; font-size:14px;
    border:1px solid #d9c9a8; border-radius:6px; background:#fffdf7;
  }
  .modal textarea{ min-height:64px; resize:vertical; }
  .modal .row{ display:flex; gap:10px; }
  .modal .row > div{ flex:1; }
  .modal .ymd{ flex:2; }
  .modal .ymd-block{ width:100%; }
  .modal .ymd-f{ display:flex; gap:6px; }
  .modal .ymd-f input{ min-width:0; }
  .modal .ymd-f input[placeholder="年"]{ flex:3; min-width:90px; }
  .modal .ymd-f input[placeholder="月"],
  .modal .ymd-f input[placeholder="日"]{ flex:1.2; min-width:60px; }
  .modal .btns{ margin-top:18px; display:flex; gap:10px; justify-content:flex-end; }
  .modal .btns button{ font-family:inherit; font-size:14px; cursor:pointer; padding:7px 16px; border-radius:6px; }
  .modal .save{ background:var(--accent); color:#fff; border:1px solid var(--accent); }
  .modal .cancel{ background:#fff; color:var(--sub); border:1px solid #ccc; }

  @media print{
    body{ background:#fff; }
    .side, .toolbar, .edit-panel, .node .acts, .overlay{ display:none !important; }
    header{ padding-top:0; }
    .scroll{ overflow:visible; padding: 0; }
    @page{ size: landscape; margin: 12mm; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title" contenteditable="true">某氏家谱</h1><br>
  <div class="sub" id="subtitle" contenteditable="true">— 世代源流图 —</div>
</header>

<div class="layout">
  <div class="main">
    <div class="toolbar">
      <button id="expandBtn">展开详情</button>
      <button id="modeBtn">进入编辑</button>
      <span class="sep"></span>
      <button id="genUp">上溯一代</button>
      <button id="genDown">下延一代</button>
      <label class="rg">起始世 <input id="rootGen" type="number" min="1" step="1" style="width:48px;font-family:inherit;padding:3px 6px;border:1px solid var(--card-border);border-radius:6px;"></label>
      <span class="sep"></span>
      <button onclick="window.print()">打印 / 存为 PDF</button>
      <label class="btn">导入 JSON<input type="file" id="importJson" accept=".json"  hidden></label>
      <button id="exportJson">导出 JSON</button>
      <button id="exportCsv">导出 CSV</button>
      <button id="exportDocx">导出 DOCX</button>
      <span class="spacer"></span>
      <span id="saveState">已保存</span>
    </div>

    <div class="scroll">
      <div class="tree" id="tree"></div>
      <div class="edit-panel" id="editPanel">
        <div class="stat" id="stat"></div>
        <button id="addRoot">＋ 添加始祖 / 新支</button>
        <button class="ghost" id="resetDemo">恢复示例</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">编辑</h3>
    <label>姓名 *</label>
    <input id="f_name" placeholder="必填">
    <div class="row">
      <div><label>字 / 号</label><input id="f_zi" placeholder="选填"></div>
      <div><label>配偶姓名</label><input id="f_spouse" placeholder="选填（保留原姓名）"></div>
    </div>
    <div class="ymd ymd-block">
      <label>生（公历，月日选填）</label>
      <div class="ymd-f">
        <input id="f_birth_y" type="number" min="1" max="3000" placeholder="年">
        <input id="f_birth_m" type="number" min="1" max="12" placeholder="月">
        <input id="f_birth_d" type="number" min="1" max="31" placeholder="日">
      </div>
    </div>
    <div class="ymd ymd-block">
      <label>卒（公历，月日选填）</label>
      <div class="ymd-f">
        <input id="f_death_y" type="number" min="1" max="3000" placeholder="年">
        <input id="f_death_m" type="number" min="1" max="12" placeholder="月">
        <input id="f_death_d" type="number" min="1" max="31" placeholder="日">
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:14px;"><input type="checkbox" id="f_deceased"> 已故（手动标记，与卒年无关）</label>
    <label style="display:flex;align-items:center;gap:6px;font-size:14px;"><input type="checkbox" id="f_female"> 女（女为锚点，配偶为上门女婿）</label>
    <div class="row">
      <div><label>家中排行</label><select id="f_order">
        <option value="">（空）</option>
        <option value="1">长子</option>
        <option value="2">次子</option>
        <option value="3">三子</option>
        <option value="4">四子</option>
        <option value="5">五子</option>
        <option value="6">六子</option>
        <option value="7">七子</option>
        <option value="8">八子</option>
        <option value="9">九子</option>
        <option value="10">十子</option>
      </select></div>
      <div><label>配偶字 / 号</label><input id="f_szi" placeholder="选填"></div>
    </div>
    <div class="ymd ymd-block">
      <label>配偶生（公历，月日选填）</label>
      <div class="ymd-f">
        <input id="f_sb_y" type="number" min="1" max="3000" placeholder="年">
        <input id="f_sb_m" type="number" min="1" max="12" placeholder="月">
        <input id="f_sb_d" type="number" min="1" max="31" placeholder="日">
      </div>
    </div>
    <div class="ymd ymd-block">
      <label>配偶卒（公历，月日选填）</label>
      <div class="ymd-f">
        <input id="f_sd_y" type="number" min="1" max="3000" placeholder="年">
        <input id="f_sd_m" type="number" min="1" max="12" placeholder="月">
        <input id="f_sd_d" type="number" min="1" max="31" placeholder="日">
      </div>
    </div>
    <label>备注（迁居 / 职业等）</label>
    <input id="f_note" placeholder="选填">
    <label>配偶备注（迁居 / 职业等）</label>
    <input id="f_snote" placeholder="选填">
    <label>墓碑所在城市</label>
    <input id="f_tomb" placeholder="选填（墓碑所在地，如：苏州）">
    <div class="btns">
      <button class="cancel" onclick="closeModal()">取消</button>
      <button class="save" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script>
const DEMO = [
  { id:"1", name:"张始祖", zi:"字某某", birth:"1825", death:"1890", spouse:"王氏" },
  { id:"2", name:"张长房", birth:"1855", death:"1912", spouse:"李氏", parent:"1" },
  { id:"3", name:"张次房", birth:"1860", spouse:"赵氏", parent:"1" },
  { id:"4", name:"张大房长子", birth:"1885", spouse:"刘氏", parent:"2" },
  { id:"5", name:"张大房次子", birth:"1888", spouse:"陈氏", parent:"2" },
  { id:"6", name:"张次房子", birth:"1895", spouse:"孙氏", parent:"3" },
  { id:"7", name:"张四代·甲", birth:"1925", death:"2001", spouse:"周氏", note:"居北京", tomb:"苏州", parent:"4" },
  { id:"8", name:"张四代·乙", birth:"1930", spouse:"吴氏", parent:"5" },
  { id:"9", name:"张四代·丙", birth:"1935", parent:"6" },
  { id:"10", name:"张五代·A", birth:"1955", spouse:"郑氏", note:"居北京", parent:"7" },
  { id:"11", name:"张五代·B", birth:"1958", parent:"7" },
  { id:"12", name:"张五代·C", birth:"1962", spouse:"冯氏", parent:"8" },
  { id:"13", name:"张五代·D", birth:"1968", parent:"9" },
];
const DEFAULT_TITLE = "某氏家谱";
const DEFAULT_SUB = "— 世代源流图 —";
const LS_KEY = "jiapu_data_v1";

let state = load();
let showSpouse = true;
let expanded = false;
let editing = null;
let pendingParent = null;

document.getElementById("title").textContent = state.title;
document.getElementById("subtitle").textContent = state.sub;
document.getElementById("rootGen").value = state.rootGen || 1;

document.getElementById("rootGen").addEventListener("change", e => {
  let v = parseInt(e.target.value, 10);
  if(isNaN(v) || v < 1) v = 1;
  state.rootGen = v;
  e.target.value = v;
  save(); render();
});

/* ===== 历法转换 ===== */
const GAN = "甲乙丙丁戊己庚辛壬癸";
const ZHI = "子丑寅卯辰巳午未申酉戌亥";
const ANI = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
function parseYear(s){
  if(s==null) return null;
  const m = String(s).match(/\d{1,4}/);
  if(!m) return null;
  const y = parseInt(m[0],10);
  return (y>=1 && y<=3000) ? y : null;
}
/* 生卒日期：支持 "年" / "年-月" / "年-月-日" 精度 */
function parseDate(s){
  if(s==null) return null;
  const m = String(s).match(/(\d{1,4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?/);
  if(!m) return null;
  const y = parseInt(m[1],10);
  if(!(y>=1 && y<=3000)) return null;
  const mo = m[2]!=null ? parseInt(m[2],10) : null;
  const d  = m[3]!=null ? parseInt(m[3],10) : null;
  return { y, m:mo, d };
}
function fmtDate(s){
  const p = parseDate(s);
  if(!p) return "";
  let t = String(p.y);
  if(p.m!=null){
    t += "年" + String(p.m) + "月";
    if(p.d!=null) t += String(p.d) + "日";
  }
  return t;
}
function joinDate(y,m,d){
  y = (y!=null && y!=="") ? String(y).trim() : "";
  if(!y) return "";
  let t = y;
  if(m!=null && m!==""){ t += "-" + String(m).padStart(2,"0");
    if(d!=null && d!=="") t += "-" + String(d).padStart(2,"0");
  }
  return t;
}
function ganzhi(y){
  const g = ((y-4)%10+10)%10, z = ((y-4)%12+12)%12;
  return GAN[g]+ZHI[z]+"年（"+ANI[z]+"）";
}
const REIGNS = [
  ["天命",1616,1626],["天聪",1626,1636],["崇德",1636,1643],["顺治",1644,1661],
  ["康熙",1662,1722],["雍正",1723,1735],["乾隆",1736,1795],["嘉庆",1796,1820],
  ["道光",1821,1850],["咸丰",1851,1861],["同治",1862,1874],["光绪",1875,1908],["宣统",1909,1911],
  ["民国",1912,1948]
];
function yearDetail(s){
  const y = parseYear(s);
  if(y==null) return null;
  const gz = ganzhi(y);
  let era = "";
  if(y<=1911){
    for(const [n,s,e] of REIGNS){ if(y>=s && y<=e){ era = n+" "+(y-s+1)+"年"; break; } }
  }
  return { gz, era };
}

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if(s && Array.isArray(s.data)){ if(!s.rootGen) s.rootGen = 1; return s; }
  }catch(e){}
  return { title:DEFAULT_TITLE, sub:DEFAULT_SUB, data:JSON.parse(JSON.stringify(DEMO)), rootGen:1 };
}
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  const el = document.getElementById("saveState");
  el.textContent = "已保存 · " + new Date().toLocaleTimeString();
  el.classList.remove("warn");
}

function maxId(){
  let m = 0;
  state.data.forEach(p => { const n = parseInt(p.id,10); if(!isNaN(n) && n>m) m=n; });
  return m;
}
function find(id){ return state.data.find(p => p.id === id); }
function childrenOf(id){ return state.data.filter(p => p.parent === id); }
function isLeaf(p){ return !childrenOf(p.id).length; }
function genOf(p){ let d=1,c=p; while(c.parent && find(c.parent)){ d++; c=find(c.parent); } return d - 1 + (state.rootGen||1); }

function personCard(p, isSpouse){
  const rec = isSpouse
    ? { name:p.spouse, birth:p.spouseBirth, death:p.spouseDeath, desc:p.spouseDesc }
    : p;
  let html = "";
  if(!isSpouse) html += `<span class="gen-tag">${genOf(p)}世</span>`;
  html += `<div class="nm">${esc(rec.name||"（佚名）")}</div>`;
  if(!isSpouse && p.order) html += `<div class="rank">${esc(rankLabel(p.order, !!p.female))}</div>`;
  if(!isSpouse && p.zi) html += `<div class="zi">字 ${esc(p.zi)}</div>`;
  if(isSpouse && p.spouseZi) html += `<div class="zi">字 ${esc(p.spouseZi)}</div>`;
  if(expanded && (rec.birth || rec.death)){
    const bs = fmtDate(rec.birth), ds = fmtDate(rec.death);
    html += `<div class="life">公历 ${esc(bs)}${bs&&ds?" – ":""}${esc(ds)}</div>`;
  }
  if(expanded && !isSpouse && p.note) html += `<div class="life2">生平：${esc(p.note)}</div>`;
  if(expanded && isSpouse && p.spouseNote) html += `<div class="life2">生平：${esc(p.spouseNote)}</div>`;
  if(expanded){
    const b = yearDetail(rec.birth), d = yearDetail(rec.death);
    if(b) html += `<div class="life2">生·农历：${b.gz}${b.era?("<br>生·封建历："+b.era):""}</div>`;
    if(d) html += `<div class="life2">卒·农历：${d.gz}${d.era?("<br>卒·封建历："+d.era):""}</div>`;
    const desc = rec.desc||"";
    const ds = isSpouse ? ' data-spouse="1"' : '';
    if(document.body.classList.contains("edit"))
      html += `<div class="desc" contenteditable="true" data-id="${p.id}"${ds}>${desc}</div>`;
    else if(desc) html += `<div class="desc">${desc}</div>`;
  }
  return `<div class="person">${html}</div>`;
}

function tombCols(p, kaoBi){
  const editMode = document.body.classList.contains("edit");
  function col(lab, name, birth, death, descTxt, sp, rank, zi, note){
    if(!name && !birth && !death && !note) return "";
    let h = `<div class="col"><div class="lab">${lab}</div>` +
            `<div class="nm">${esc(name||"（佚名）")}</div>`;
    if(rank) h += `<div class="rank">${esc(rank)}</div>`;
    if(!sp && zi) h += `<div class="zi">字 ${esc(zi)}</div>`;
    if(sp && zi) h += `<div class="zi">字 ${esc(zi)}</div>`;
    if(expanded && (birth||death))
      h += `<div class="life">公历 ${esc(fmtDate(birth))}${birth&&death?" – ":""}${esc(fmtDate(death))}</div>`;
    if(expanded && note) h += `<div class="life2">生平：${esc(note)}</div>`;
    if(expanded){
      const b=yearDetail(birth), d=yearDetail(death);
      if(b) h += `<div class="life2">生·农历：${b.gz}${b.era?("<br>生·封建历："+b.era):""}</div>`;
      if(d) h += `<div class="life2">卒·农历：${d.gz}${d.era?("<br>卒·封建历："+d.era):""}</div>`;
      const ds = sp ? ' data-spouse="1"' : '';
      const dv = descTxt||"";
      if(editMode) h += `<div class="desc" contenteditable="true" data-id="${p.id}"${ds}>${dv}</div>`;
      else if(dv) h += `<div class="desc">${dv}</div>`;
    }
    h += `</div>`;
    return h;
  }
  const female = !!p.female;
  const sN=p.spouse||"", sB=p.spouseBirth||"", sD=p.spouseDeath||"", sDesc=p.spouseDesc||"", sZi=p.spouseZi||"", sNote=p.spouseNote||"";
  const rank = p.order ? rankLabel(p.order, female) : "";
  let html = "";
  if(female){
    // 女方为锚点，配偶为上门女婿：本人(妣)居左，配偶(考)居右
    const labP = kaoBi ? "妣" : "";
    const labS = kaoBi ? "考" : "";
    html += col(labP, p.name, p.birth, p.death, p.desc, false, rank, p.zi, p.note);
    if(sN||sB||sD||sDesc||sNote) html += col(labS, sN, sB, sD, sDesc, true, "", sZi, sNote);
  }else{
    // 男方为锚点：配偶(妣)居左，本人(考)居右
    const labP = kaoBi ? "考" : "";
    const labS = kaoBi ? "妣" : "";
    if(sN||sB||sD||sDesc||sNote) html += col(labS, sN, sB, sD, sDesc, true, "", sZi, sNote);
    html += col(labP, p.name, p.birth, p.death, p.desc, false, rank, p.zi, p.note);
  }
  return html;
}

function makeNode(p, gen){
  const li = document.createElement("li");
  const node = document.createElement("div");
  node.className = "node";
  const editMode = document.body.classList.contains("edit");
  let html;
  if(!editMode){
    const kaoBi = !!(p.deceased || p.death); // 已故显示考妣，在世不显示
    const loc = p.tombAddr || p.tomb || "";
    html = `<div class="tomb"><span class="gen-tag">${genOf(p)}世</span>` +
           `<div class="cols">${tombCols(p, kaoBi)}</div>` +
           (loc ? `<div class="tomb-addr-side"><span class="addr-lab">葬于</span>` +
             (editMode
               ? `<div class="addr-v" contenteditable="true" data-id="${p.id}" data-field="tombAddr">${loc}</div>`
               : `<div class="addr-v">${esc(loc)}</div>`) +
             `</div>`
             : "") +
           `</div>`;
  }else{
    let inner = personCard(p, false);
    if(showSpouse && p.spouse) inner += personCard(p, true);
    html = `<div class="family"><div class="pair">${inner}</div></div>`;
  }
  if(editMode){
    html += `<div class="acts">
      <button onclick="editPerson('${p.id}')">编辑</button>
      <button onclick="addChild('${p.id}')">加子女</button>
      <button class="del" onclick="delPerson('${p.id}')">删除</button>
    </div>`;
  }
  node.innerHTML = html;
  li.appendChild(node);

  const kids = childrenOf(p.id).slice().sort((a,b) => {
    const ga = a.female ? 0 : 1;           // 女(0)在左，男(1)在右
    const gb = b.female ? 0 : 1;
    if(ga !== gb) return ga - gb;
    const oa = a.order ? +a.order : 999;
    const ob = b.order ? +b.order : 999;
    return ob - oa;                        // 同性别内排行降序：长女在右
  });
  if(kids.length){
    const ul = document.createElement("ul");
    kids.forEach(c => ul.appendChild(makeNode(c, gen+1)));
    li.appendChild(ul);
  }
  return li;
}

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const tree = document.getElementById("tree");
  tree.innerHTML = "";
  const roots = state.data.filter(p => !p.parent);
  const ul = document.createElement("ul");
  roots.forEach(r => ul.appendChild(makeNode(r, 1)));
  tree.appendChild(ul);
  const gens = new Set();
  state.data.forEach(p => gens.add(genOf(p)));
  document.getElementById("stat").textContent =
    `共 ${state.data.length} 人，分 ${gens.size} 世。在每个人下方「加子女」可开新枝；「删除」会连同其子孙一并移除。`;
}

/* 排行下拉标签随「女」切换 子/女 */
const RANK_NUMS = ["","长","次","三","四","五","六","七","八","九","十"];
function rankLabel(order, female){
  const n = +order; if(!n || n<1 || n>10) return "";
  return RANK_NUMS[n] + (female ? "女" : "子");
}
function syncOrderLabels(){
  const female = document.getElementById("f_female").checked;
  const sel = document.getElementById("f_order");
  Array.from(sel.options).forEach(o => {
    const v = o.value;
    o.textContent = v==="" ? "（空）" : rankLabel(v, female);
  });
}

/* =====  (edit ops) ===== */
function openModal(p){
  editing = p;
  document.getElementById("modalTitle").textContent = p ? "编辑成员" : "新增成员";
  document.getElementById("f_name").value  = p ? (p.name||"") : "";
  document.getElementById("f_zi").value    = p ? (p.zi||"") : "";
  const _b = p ? parseDate(p.birth) : null, _d = p ? parseDate(p.death) : null;
  const _sb = p ? parseDate(p.spouseBirth) : null, _sd = p ? parseDate(p.spouseDeath) : null;
  document.getElementById("f_birth_y").value = _b?_b.y:"";
  document.getElementById("f_birth_m").value = _b&&_b.m!=null?_b.m:"";
  document.getElementById("f_birth_d").value = _b&&_b.d!=null?_b.d:"";
  document.getElementById("f_death_y").value = _d?_d.y:"";
  document.getElementById("f_death_m").value = _d&&_d.m!=null?_d.m:"";
  document.getElementById("f_death_d").value = _d&&_d.d!=null?_d.d:"";
  document.getElementById("f_spouse").value= p ? (p.spouse||"") : "";
  document.getElementById("f_sb_y").value = _sb?_sb.y:"";
  document.getElementById("f_sb_m").value = _sb&&_sb.m!=null?_sb.m:"";
  document.getElementById("f_sb_d").value = _sb&&_sb.d!=null?_sb.d:"";
  document.getElementById("f_sd_y").value = _sd?_sd.y:"";
  document.getElementById("f_sd_m").value = _sd&&_sd.m!=null?_sd.m:"";
  document.getElementById("f_sd_d").value = _sd&&_sd.d!=null?_sd.d:"";
  document.getElementById("f_szi").value     = p ? (p.spouseZi||"") : "";
  document.getElementById("f_note").value   = p ? (p.note||"") : "";
  document.getElementById("f_snote").value   = p ? (p.spouseNote||"") : "";
  document.getElementById("f_order").value   = p ? (p.order||"") : "";
  document.getElementById("f_tomb").value   = p ? (p.tomb||"") : "";
  document.getElementById("f_deceased").checked = !!(p && p.deceased);
  document.getElementById("f_female").checked   = !!(p && p.female);
  syncOrderLabels();
  document.getElementById("overlay").classList.add("show");
  document.getElementById("f_name").focus();
}
function closeModal(){ document.getElementById("overlay").classList.remove("show"); editing=null; }

function saveModal(){
  const name = document.getElementById("f_name").value.trim();
  if(!name){ alert("姓名不能为空"); return; }
  const obj = {
    name,
    zi: document.getElementById("f_zi").value.trim(),
    birth: joinDate(document.getElementById("f_birth_y").value, document.getElementById("f_birth_m").value, document.getElementById("f_birth_d").value),
    death: joinDate(document.getElementById("f_death_y").value, document.getElementById("f_death_m").value, document.getElementById("f_death_d").value),
    spouse: document.getElementById("f_spouse").value.trim(),
    spouseBirth: joinDate(document.getElementById("f_sb_y").value, document.getElementById("f_sb_m").value, document.getElementById("f_sb_d").value),
    spouseDeath: joinDate(document.getElementById("f_sd_y").value, document.getElementById("f_sd_m").value, document.getElementById("f_sd_d").value),
    spouseZi: document.getElementById("f_szi").value.trim(),
    note: document.getElementById("f_note").value.trim(),
    spouseNote: document.getElementById("f_snote").value.trim(),
    tomb: document.getElementById("f_tomb").value.trim(),
    deceased: document.getElementById("f_deceased").checked,
    female: document.getElementById("f_female").checked,
    order: document.getElementById("f_order").value || "",
    female: document.getElementById("f_female").checked,
  };
  if(editing){
    Object.assign(editing, obj);
  }else{
    const id = String(maxId()+1);
    obj.id = id; obj.parent = pendingParent;
    state.data.push(obj);
  }
  closeModal(); save(); render();
}

function addChild(parentId){ pendingParent = parentId; openModal(null); }
function editPerson(id){ pendingParent=null; openModal(find(id)); }
function delPerson(id){
  const kids = childrenOf(id).length;
  const nm = find(id).name;
  let msg = `确定删除「${nm}」吗？`;
  if(kids) msg += `其下 ${kids} 名子孙也会一并删除。`;
  if(!confirm(msg)) return;
  function kill(pid){
    childrenOf(pid).forEach(c => kill(c.id));
    state.data = state.data.filter(p => p.id !== pid);
  }
  kill(id);
  save(); render();
}

document.getElementById("saveBtn").addEventListener("click", saveModal);
document.getElementById("overlay").addEventListener("click", e => { if(e.target.id==="overlay") closeModal(); });

  const escCsv = v => { v=v==null?"":String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };

/* 导出 DOCX */
function loadHtmlDocx(cb){
  if(window.htmlDocx){ cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js';
  s.onload = cb;
  s.onerror = () => alert('无法加载 DOCX 库，请检查网络后重试');
  document.head.appendChild(s);
}

function buildDocxHtml(){
  const MAX = 5;
  function stripTags(s){ return (s||'').replace(/<[^>]+>/g,''); }
  function personHtml(p, isSpouse){
    const r = isSpouse
      ? { name:p.spouse, birth:p.spouseBirth, death:p.spouseDeath, desc:p.spouseDesc }
      : { name:p.name, birth:p.birth, death:p.death, desc:p.desc };
    let h = '';
    if(!isSpouse && p.order) h += `<div class="sub">${esc(rankLabel(p.order,!!p.female))}</div>`;
    h += `<div class="nm">${esc(r.name||'（佚名）')}</div>`;
    if(!isSpouse && p.zi) h += `<div class="sub">字 ${esc(p.zi)}</div>`;
    if(isSpouse && p.spouseZi) h += `<div class="sub">字 ${esc(p.spouseZi)}</div>`;
    if(r.birth||r.death) h += `<div class="sub">公历 ${esc(fmtDate(r.birth))}${r.birth&&r.death?' – ':''}${esc(fmtDate(r.death))}</div>`;
    const b = yearDetail(r.birth), d = yearDetail(r.death);
    if(b) h += `<div class="sub">农历 ${b.gz}${b.era?' / '+b.era:''}</div>`;
    if(d) h += `<div class="sub">农历 ${d.gz}${d.era?' / '+d.era:''}</div>`;
    if(!isSpouse && p.note) h += `<div class="sub">${esc(p.note)}</div>`;
    if(isSpouse && p.spouseNote) h += `<div class="sub">${esc(p.spouseNote)}</div>`;
    if(!isSpouse && p.tomb) h += `<div class="sub">墓：${esc(p.tomb)}</div>`;
    if(!isSpouse && p.tombAddr) h += `<div class="sub">葬于 ${esc(stripTags(p.tombAddr))}</div>`;
    const desc = stripTags(r.desc);
    if(desc) h += `<div class="sub">${esc(desc)}</div>`;
    return h;
  }
  function walk(person){
    const kids = childrenOf(person.id).slice().sort((a,b)=>{
      const ga=a.female?0:1, gb=b.female?0:1;
      if(ga!==gb) return ga-gb;
      const oa=a.order?+a.order:999, ob=b.order?+b.order:999;
      return ob-oa;
    });
    if(!kids.length) return;
    const gen = genOf(person);
    const batches = [];
    for(let i=0;i<kids.length;i+=MAX) batches.push(kids.slice(i,i+MAX));
    batches.forEach((batch,bi)=>{
      html += `<div class="family">`;
      html += `<div class="gh">第${gen}世 → 第${gen+1}世${batches.length>1?`（${bi+1}/${batches.length}）`:''}</div>`;
      html += `<table><tr>`;
      html += `<td class="pc" style="width:50%">${personHtml(person,false)}</td>`;
      html += `<td style="width:50%">${person.spouse?personHtml(person,true):'&nbsp;'}</td>`;
      html += `</tr></table>`;
      html += `<table><tr>`;
      batch.forEach(kid => { html += `<td class="cc">${personHtml(kid,false)}</td>`; });
      html += `</tr></table>`;
      html += `</div>`;
    });
    kids.forEach(walk);
  }

  let html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@page{size:A4;margin:2cm;}
body{font-family:"SimSun","Songti SC",serif;font-size:12pt;color:#3a2e1f;}
.tp{text-align:center;page-break-after:always;}
.tp h1{font-size:36pt;margin-top:25%;letter-spacing:8pt;color:#8c5a2b;}
.tp p{font-size:14pt;color:#7a6a52;}
.family{page-break-before:always;}
.gh{font-size:14pt;font-weight:bold;text-align:center;border-bottom:1.5pt solid #8c5a2b;padding-bottom:4pt;margin-bottom:8pt;}
table{width:100%;border-collapse:collapse;margin-bottom:8pt;}
td{border:1px solid #b0a080;padding:5pt;font-size:10pt;vertical-align:top;}
.pc{background:#f5f0e0;}
.cc{text-align:center;}
.nm{font-size:13pt;font-weight:bold;margin-bottom:2pt;}
.sub{font-size:9pt;color:#7a6a52;margin-bottom:1pt;}
</style></head><body>`;

  html += `<div class="tp"><h1>${esc(state.title)}</h1><p>${esc(state.sub)}</p></div>`;
  state.data.filter(p => !p.parent).forEach(walk);
  html += `</body></html>`;
  return html;
}

document.getElementById("exportDocx").addEventListener("click", () => {
  loadHtmlDocx(() => {
    const html = buildDocxHtml();
    const blob = window.htmlDocx.asBlob(html, {
      orientation:'portrait',
      margins:{top:1440,right:1440,bottom:1440,left:1440}
    });
    download(blob, (state.title||'jiapu')+'.docx');
  });
});

/* 导入 JSON */
document.getElementById("importJson").addEventListener("change", e => {
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const s = JSON.parse(r.result);
      if(!s.data || !Array.isArray(s.data)) throw 0;
      state = s; save(); render();
      document.getElementById("title").textContent = state.title;
      document.getElementById("subtitle").textContent = state.sub;
      alert("导入成功");
    }catch(err){ alert("文件格式不正确"); }
  };
  r.readAsText(file);
  e.target.value = "";
});

function download(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}
